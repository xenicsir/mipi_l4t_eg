# ---------------------------------------------------------------------------
# Vendors and carriers
# ---------------------------------------------------------------------------
vendors:
  generic:
    carriers: [generic]
    default_carrier: generic
  forecr:
    carriers: [dsboard_ornxs]
    default_carrier: dsboard_ornxs
  # Connect Tech Hadron DM, two independent build variants of the same board.
  # They are separate vendors rather than a build flag because the vendor axis
  # already keys the three things that genuinely differ between them: the
  # source layer (VENDOR_SOURCE_DIR), the build tree (LINUX_FOR_TEGRA_DIR) and
  # the package name (L4T_VERSION_EXTENDED). The carrier stays hadron_dm in
  # both, so the on-target scripts (EG_FORCE_BOARD=hadron-dm) are unaffected.
  #
  # cti — full kernel built from CTI's own GPL sources, like forecr. Our
  # nvidia-oot framework patches apply, so Y16/iLumos/Microlynx work.
  cti:
    carriers: [hadron_dm]
    default_carrier: hadron_dm
    # CTI's source archive is confidential and has no download url. When it is
    # absent this whole configuration is skipped by enumerate_configs (rather
    # than failing, or worse, silently producing a package without the vendor
    # sources). Names a key under versions.<ver>.sources.
    requires_archive: cti
    # Build with CTI's own kernel defconfig, not the generic one. It ships in
    # CTI's extracted sources (arch/arm64/configs/cti_tegra_defconfig) and is
    # already in the build tree after --copy-sources. Without this, the generic
    # defconfig leaves BLK_DEV_NVME and PCIE_TEGRA194_HOST as modules (CTI has
    # them =y): the NVMe rootfs is then mounted by the initramfs ~26 s later
    # than by CTI's own kernel. Per-vendor override (wins over the carrier) —
    # NOT set on cti_pristine, which has no kernel sources and only builds a
    # throwaway generic kernel anyway. See l4t_environment.sh / Scenario C.
    defconfig: cti_tegra_defconfig
  # cti_pristine — CTI's precompiled kernel/nvidia-oot, which we cannot
  # rebuild: our framework patches (camera_common.c, channel.c,
  # vi5_formats.h...) can't be applied, only our own two .ko are recompiled
  # against their real ABI. Consumed by l4t_environment.sh to export
  # PRISTINE_KERNEL, which gates: (1) copy of the nvidia-oot framework-patch
  # files in l4t_copy_sources.sh, (2) obj-m/dtbo-y entries in the i2c and
  # overlay Makefiles, (3) #ifdef guards in EG driver/DTSI code (e.g. Y16
  # disabled on eg_ec_mipi since CTI's kernel can't negotiate it).
  cti_pristine:
    carriers: [hadron_dm]
    default_carrier: hadron_dm
    pristine_kernel: true

carriers:
  generic:
    defconfig: tegra_defconfig
    dir_suffix: ""
  dsboard_ornxs:
    defconfig: dsboard_ornx_defconfig
    dir_suffix: dsboard_ornxs
  hadron_dm:
    # kernel-jammy-src (36.x) names its own default config file "defconfig"
    # (not "tegra_defconfig", that's a 32.x/35.x kernel-4.9/5.10 convention).
    # We don't ship a CTI-specific kernel config, so just reuse NVIDIA's own.
    defconfig: defconfig
    dir_suffix: hadron_dm

soms:
  t210:
    defconfig: tegra_defconfig
    dir_suffix: t210
  t186:
    defconfig: tegra_defconfig
    dir_suffix: t186

# ---------------------------------------------------------------------------
# Pixel format → DT field mapping
# ---------------------------------------------------------------------------
pixel_format_map:
  Y16:      {mode_type: "raw", pixel_phase: "grey",    csi_pixel_bit_depth: 16}
  "Y16 -BE": {mode_type: "raw", pixel_phase: "grey_be", csi_pixel_bit_depth: 16}
  Y14:      {mode_type: "raw", pixel_phase: "grey",    csi_pixel_bit_depth: 14}
  RGB888: {mode_type: "rgb", pixel_phase: "rgb888", csi_pixel_bit_depth: 24}
  YUYV:   {mode_type: "yuv", pixel_phase: "yuyv",   csi_pixel_bit_depth: 16}

# ---------------------------------------------------------------------------
# Platform restrictions
#
# A camera whose EVERY mode uses a restricted format is not supported on that
# platform at all: its node must be absent from the platform's DTSI, and the
# deployment matrix marks it not_supported. verify_dtsi_structure.py checks both
# directions.
#
# The 32.x SoMs (T210 Nano, T186 TX2) have no 14- or 16-bit greyscale entry in
# their VI format table (vi2_formats.h / vi4_formats.h), and we do not add one —
# those L4T versions are obsolete and it is not worth the effort (decision
# 2026-08-17). Y14/Y16 therefore cannot be selected there whatever the device
# tree declares, which rules out iLumos and Microlynx entirely on both SoMs.
# ---------------------------------------------------------------------------
platform_restrictions:
  nano_t210:
    unsupported_formats: [Y16, "Y16 -BE", Y14]
  tx2_t186:
    unsupported_formats: [Y16, "Y16 -BE", Y14]

# ---------------------------------------------------------------------------
# DTSI platforms
# Paths are relative to sources/common/source/
# ec_overlay_cam0_pattern: use {variant} → "1-lane" or "2-lanes"
# ---------------------------------------------------------------------------
dtsi_platforms:
  porg:
    dtsi: "hardware_32+/nvidia/platform/t210/porg/kernel-dts/tegra210-camera-common-eg-cams-dione.dtsi"
    num_cams: 2
    platform_ids: [nano_t210]
    ec_overlay_cam0_pattern: "hardware_32+/nvidia/platform/t210/porg/kernel-dts/tegra210-camera-eg-cam0-ec-{variant}.dts"

  jakku:
    dtsi: "hardware_32+/nvidia/platform/t19x/jakku/kernel-dts/tegra194-camera-common-eg-cams-dione.dtsi"
    num_cams: 2
    platform_ids: [xavier_nx]
    ec_overlay_cam0_pattern: "hardware_32+/nvidia/platform/t19x/jakku/kernel-dts/tegra194-camera-eg-cam0-ec-{variant}.dts"

  concord:
    dtsi: "hardware_32+/nvidia/platform/t23x/concord/kernel-dts/tegra234-p3737-camera-common-eg-cams-dione.dtsi"
    num_cams: 4
    platform_ids: [agx_orin_devkit, agx_orin_x230d]
    ec_overlay_cam0_pattern: "hardware_32+/nvidia/platform/t23x/concord/kernel-dts/tegra234-p3737-camera-eg-cam0-ec-{variant}.dts"

  p3768:
    dtsi: "hardware_32+/nvidia/platform/t23x/p3768/kernel-dts/tegra234-p3767-camera-common-eg-cams-dione.dtsi"
    num_cams: 2
