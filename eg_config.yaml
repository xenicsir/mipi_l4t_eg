# eg_config.yaml — EG MIPI camera project unified configuration
#
# This file merges two former files:
#   - l4t_versions.json  (L4T build system: versions, vendors, carriers)
#   - camera_db.yaml     (camera technical database: formats, DTSIs, modes)
#
# Sections:
#   versions, vendors, carriers  — L4T BSP build configuration
#   pixel_format_map             — pixel format → DT field mapping
#   platform_restrictions        — per-platform format restrictions
#   dtsi_platforms               — DTSI file locations and EC overlay patterns
#   cameras                      — per-camera resolutions, modes, clocks
#
# Consumed by:
#   tools/egcfg.py               — CLI query helper for bash scripts
#   l4t_environment.sh           — via egcfg.py
#   tools/l4t_completion.bash    — via egcfg.py
#   tools/verify_dtsi_structure.py
#   generate_deployment_matrix.py

# ---------------------------------------------------------------------------
# L4T versions
#
# jetpack: corresponding JetPack SDK version (https://developer.nvidia.com/embedded/jetpack-archive)
# platform_ids: deployment platforms supported by this version
#   nano_t210          Jetson Nano (T210 / 32.x only)
#   xavier_nx          Jetson Xavier NX (32.x, 35.x)
#   agx_orin_devkit    AGX Orin developer kit (35.1+, 36.x)
#   agx_orin_x230d     Auvidea X230D AGX Orin (35.1+, 36.x)
#   orin_nx_nano_devkit Orin NX / Nano devkit (35.3.1+, 36.x)
#   forecr_ornxs       Forecr DSBOARD ORNXS (35.3.1+, 36.x)
# ---------------------------------------------------------------------------
