    platform_ids: [orin_nx_nano_devkit, forecr_ornxs]
    ec_overlay_cam0_pattern: "hardware_36+/nvidia/t23x/nv-public/overlay/tegra234-p3767-camera-p3768-eg-cam0-ec-{variant}.dts"

