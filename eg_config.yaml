# ---------------------------------------------------------------------------
# Vendors and carriers
# ---------------------------------------------------------------------------
vendors:
  generic:
    carriers: [generic]
    default_carrier: generic
  forecr:
    carriers: [dsboard_ornxs]
    default_carrier: dsboard_ornxs

carriers:
  generic:
    defconfig: tegra_defconfig
    dir_suffix: ""
  dsboard_ornxs:
    defconfig: dsboard_ornx_defconfig
    dir_suffix: dsboard_ornxs

soms:
  t210:
    defconfig: tegra_defconfig
    dir_suffix: t210
  t186:
    defconfig: tegra_defconfig
    dir_suffix: t186

# ---------------------------------------------------------------------------
# Pixel format → DT field mapping
# ---------------------------------------------------------------------------
pixel_format_map:
  Y16:    {mode_type: "raw", pixel_phase: "grey",   csi_pixel_bit_depth: 16}
  Y14:    {mode_type: "raw", pixel_phase: "grey",   csi_pixel_bit_depth: 14}
  RGB888: {mode_type: "rgb", pixel_phase: "rgb888", csi_pixel_bit_depth: 24}
  YUYV:   {mode_type: "yuv", pixel_phase: "yuyv",   csi_pixel_bit_depth: 16}

# ---------------------------------------------------------------------------
# Platform restrictions
# ---------------------------------------------------------------------------
platform_restrictions:
  nano_t210:
    unsupported_formats: [Y16]   # Y14 is supported on T210; only Y16 is excluded

# ---------------------------------------------------------------------------
# DTSI platforms
# Paths are relative to sources/common/source/
# ec_overlay_cam0_pattern: use {variant} → "1-lane" or "2-lanes"
# ---------------------------------------------------------------------------
dtsi_platforms:
  porg:
    dtsi: "hardware_32+/nvidia/platform/t210/porg/kernel-dts/tegra210-camera-common-eg-cams-dione.dtsi"
    num_cams: 2
    platform_ids: [nano_t210]
    ec_overlay_cam0_pattern: "hardware_32+/nvidia/platform/t210/porg/kernel-dts/tegra210-camera-eg-cam0-ec-{variant}.dts"

  jakku:
    dtsi: "hardware_32+/nvidia/platform/t19x/jakku/kernel-dts/tegra194-camera-common-eg-cams-dione.dtsi"
    num_cams: 2
    platform_ids: [xavier_nx]
    ec_overlay_cam0_pattern: "hardware_32+/nvidia/platform/t19x/jakku/kernel-dts/tegra194-camera-eg-cam0-ec-{variant}.dts"

  concord:
    dtsi: "hardware_32+/nvidia/platform/t23x/concord/kernel-dts/tegra234-p3737-camera-common-eg-cams-dione.dtsi"
    num_cams: 4
    platform_ids: [agx_orin_devkit, agx_orin_x230d]
    ec_overlay_cam0_pattern: "hardware_32+/nvidia/platform/t23x/concord/kernel-dts/tegra234-p3737-camera-eg-cam0-ec-{variant}.dts"

  p3768:
    dtsi: "hardware_32+/nvidia/platform/t23x/p3768/kernel-dts/tegra234-p3767-camera-common-eg-cams-dione.dtsi"
    num_cams: 2
    platform_ids: [orin_nx_nano_devkit, forecr_ornxs]
    ec_overlay_cam0_pattern: "hardware_32+/nvidia/platform/t23x/p3768/kernel-dts/tegra234-p3767-camera-p3768-eg-cam0-ec-{variant}.dts"

  p3737-36:
    dtsi: "hardware_36+/nvidia/t23x/nv-public/overlay/tegra234-p3737-camera-common-eg-cams-dione.dtsi"
    num_cams: 4
    platform_ids: [agx_orin_devkit, agx_orin_x230d]
    ec_overlay_cam0_pattern: "hardware_36+/nvidia/t23x/nv-public/overlay/tegra234-p3737-camera-eg-cam0-ec-{variant}.dts"

  p3767-36:
    dtsi: "hardware_36+/nvidia/t23x/nv-public/overlay/tegra234-p3767-camera-common-eg-cams-dione.dtsi"
    num_cams: 2
    platform_ids: [orin_nx_nano_devkit, forecr_ornxs]
    ec_overlay_cam0_pattern: "hardware_36+/nvidia/t23x/nv-public/overlay/tegra234-p3767-camera-p3768-eg-cam0-ec-{variant}.dts"

  quill:
    dtsi: "hardware_32+/nvidia/platform/t18x/quill/kernel-dts/tegra186-camera-common-eg-cams-dione.dtsi"
    num_cams: 2
    platform_ids: [tx2_t186]
    ec_overlay_cam0_pattern: "hardware_32+/nvidia/platform/t18x/quill/kernel-dts/tegra186-camera-eg-cam0-ec-{variant}.dts"

# ---------------------------------------------------------------------------
# Cameras
#
# dt_node_label_prefix: label prefix in DTSI (e.g. "microlynx_cam" → microlynx_cam0)
# ec_overlay_variant: for EC-based cameras only — "1-lane" or "2-lanes"
# ec_dtsi_mode_labels: expected comment labels in the eg_ec node (to match modes)
# resolutions: list of resolutions, each with:
#   - data_lanes: physical lane count (from overlay bus-width for EC cameras)
#   - discontinuous_clk: from DTSI
#   - modes: list of pixel formats with DT fields + display metadata
# ---------------------------------------------------------------------------
cameras:
  dione_ir:
    name: "Dione"
    dt_node_label_prefix: "dione_ir_cam"
    resolutions:
      - res: "640x480"
        active_w: 640
        active_h: 480
        data_lanes: 2
        discontinuous_clk: "no"
        modes:
          - pixel_format: "RGB888"
            line_length: 694
            pix_clk_hz: 20000000
            csi_clock_mhz: 120
      - res: "1280x1024"
        active_w: 1280
        active_h: 1024
        data_lanes: 2
        discontinuous_clk: "no"
        modes:
          - pixel_format: "RGB888"
            line_length: 1334
            pix_clk_hz: 83000000
            csi_clock_mhz: 498
      - res: "320x240"
        active_w: 320
        active_h: 240
        data_lanes: 2
        discontinuous_clk: "no"
        modes:
          - pixel_format: "RGB888"
            line_length: 1404
            pix_clk_hz: 20000000
            csi_clock_mhz: 120
      - res: "1024x768"
        active_w: 1024
        active_h: 768
        data_lanes: 2
        discontinuous_clk: "no"
        modes:
          - pixel_format: "RGB888"
            line_length: 1079
            pix_clk_hz: 83000000
            csi_clock_mhz: 498

  microcube:
    name: "MicroCube"
    dt_node_label_prefix: "eg_ec_cam"
    ec_overlay_variant: "1-lane"
    # Which EC_MODE labels in the DTSI belong to this camera
    ec_dtsi_mode_labels: [EC_MODE_640x480_RAW16, EC_MODE_640x480_RGB888, EC_MODE_640x480_YUYV]
    resolutions:
      - res: "640x480"
        active_w: 640
        active_h: 480
        data_lanes: 1    # from overlay bus-width (ec-1-lane)
        discontinuous_clk: "yes"
        modes:
          - pixel_format: "Y16"
            line_length: 640
            pix_clk_hz: 20000000    # overridden by ec-1-lane overlay (DTSI has 100MHz)
            csi_clock_mhz: 160
          - pixel_format: "RGB888"
            line_length: 640
            pix_clk_hz: 20000000    # overridden by ec-1-lane overlay
            csi_clock_mhz: 240
          - pixel_format: "YUYV"
            line_length: 640
            pix_clk_hz: 20000000    # overridden by ec-1-lane overlay
            csi_clock_mhz: 160

  smartir640:
    name: "SmartIR640"
    dt_node_label_prefix: "eg_ec_cam"
    ec_overlay_variant: "2-lanes"
    ec_dtsi_mode_labels: [EC_MODE_640x480_RAW16, EC_MODE_640x480_RGB888, EC_MODE_640x480_YUYV]
    resolutions:
      - res: "640x480"
        active_w: 640
        active_h: 480
        data_lanes: 2
        discontinuous_clk: "yes"
        modes:
          - pixel_format: "Y16"
            line_length: 640
            pix_clk_hz: 100000000
            csi_clock_mhz: 400
          - pixel_format: "RGB888"
            line_length: 640
            pix_clk_hz: 100000000
            csi_clock_mhz: 600
          - pixel_format: "YUYV"
            line_length: 640
            pix_clk_hz: 100000000
            csi_clock_mhz: 400

  crius1280:
    name: "Crius1280"
    dt_node_label_prefix: "eg_ec_cam"
    ec_overlay_variant: "2-lanes"
    ec_dtsi_mode_labels: [EC_MODE_1280x1024_RAW16, EC_MODE_1280x1024_RGB888, EC_MODE_1280x1024_YUYV]
    resolutions:
      - res: "1280x1024"
        active_w: 1280
        active_h: 1024
        data_lanes: 2
        discontinuous_clk: "yes"
        modes:
          - pixel_format: "Y16"
            line_length: 1280
            pix_clk_hz: 100000000
            csi_clock_mhz: 400
          - pixel_format: "RGB888"
            line_length: 1280
            pix_clk_hz: 133333336
            csi_clock_mhz: 800
          - pixel_format: "YUYV"
            line_length: 1280
            pix_clk_hz: 100000000
            csi_clock_mhz: 400

  ilumos:
    name: "iLumos"
    dt_node_label_prefix: "ilumos_cam"
    resolutions:
      - res: "2048x2048"
        active_w: 2048
        active_h: 2048
        data_lanes: 2
        discontinuous_clk: "no"
        modes:
          - pixel_format: "Y16"
            line_length: 2048
            pix_clk_hz: 100000000
            csi_clock_mhz: 450
          - pixel_format: "Y14"
            line_length: 2048
            pix_clk_hz: 100000000
            csi_clock_mhz: 450
      - res: "2048x1088"
        active_w: 2048
        active_h: 1088
        data_lanes: 2
        discontinuous_clk: "no"
        modes:
          - pixel_format: "Y16"
            line_length: 2048
            pix_clk_hz: 100000000
            csi_clock_mhz: 450
          - pixel_format: "Y14"
            line_length: 2048
            pix_clk_hz: 100000000
            csi_clock_mhz: 450
      - res: "1280x1024"
        active_w: 1280
        active_h: 1024
        data_lanes: 2
        discontinuous_clk: "no"
        modes:
          - pixel_format: "Y16"
            line_length: 1280
            pix_clk_hz: 148750000
            csi_clock_mhz: 595
          - pixel_format: "Y14"
            line_length: 1280
            pix_clk_hz: 100000000
            csi_clock_mhz: 450

  microlynx:
    name: "Microlynx"
    dt_node_label_prefix: "microlynx_cam"
    resolutions:
      - res: "1024x128"
        active_w: 1024
        active_h: 128
        data_lanes: 2
        discontinuous_clk: "no"
        modes:
          - pixel_format: "Y16"
            line_length: 1024
            pix_clk_hz: 87500000    # 87.5 MHz → 350 MHz CSI / (2 lanes × 2 DDR / 16 bits)
            csi_clock_mhz: 350
          - pixel_format: "Y14"
            line_length: 1024
            pix_clk_hz: 100000000
            csi_clock_mhz: 350
