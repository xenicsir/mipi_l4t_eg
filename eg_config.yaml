# ---------------------------------------------------------------------------
# Cameras
#
# dt_node_label_prefix: label prefix in DTSI (e.g. "microlynx_cam" → microlynx_cam0)
# ec_overlay_variant: for EC-based cameras only — "1-lane" or "2-lanes"
# ec_dtsi_mode_labels: expected comment labels in the eg_ec node (to match modes)
# resolutions: list of resolutions, each with:
#   - data_lanes: physical lane count (from overlay bus-width for EC cameras)
#   - discontinuous_clk: from DTSI
#   - modes: list of pixel formats with DT fields + display metadata
# ---------------------------------------------------------------------------
cameras:
  dione_ir:
    name: "Dione"
    dt_node_label_prefix: "dione_ir_cam"
    resolutions:
      - res: "640x480"
        active_w: 640
        active_h: 480
        data_lanes: 2
        discontinuous_clk: "no"
        modes:
          - pixel_format: "RGB888"
            line_length: 694
            pix_clk_hz: 20000000
      - res: "1280x1024"
        active_w: 1280
        active_h: 1024
        data_lanes: 2
        discontinuous_clk: "no"
        modes:
          - pixel_format: "RGB888"
            line_length: 1334
            pix_clk_hz: 83000000
      - res: "320x240"
