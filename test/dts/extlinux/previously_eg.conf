TIMEOUT 30
DEFAULT JetsonIO

MENU TITLE L4T boot options

LABEL primary
    MENU LABEL primary kernel
    LINUX /boot/Image
    INITRD /boot/initrd
    APPEND ${cbootargs} quiet root=/dev/mmcblk0p1 rw rootwait rootfstype=ext4 console=ttyTCU0,115200 console=tty0 fbcon=map:0 net.ifnames=0
    FDT {FDT}

LABEL JetsonIO
    MENU LABEL Custom Header Config: <HDR 2 Exosens Cameras. CAM0:EC_1_lane>
    LINUX /boot/Image
    INITRD /boot/initrd
    APPEND ${cbootargs} quiet root=/dev/mmcblk0p1 rw rootwait rootfstype=ext4 console=ttyTCU0,115200 console=tty0 fbcon=map:0 net.ifnames=0
    FDT /boot/{FDT_BASENAME_NO_EXT}-user-custom.dtb
    OVERLAYS {PREVIOUS_OVERLAYS}
