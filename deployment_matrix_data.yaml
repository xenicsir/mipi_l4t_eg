# MIPI Camera Deployment Matrix
# Source of truth for all deployment documentation
#
# Status values:
#   tested              = Tested on this platform
#   theoretically_supported = Theoretically supported but not tested
#   not_supported       = Not supported on this platform (HW/FW incompatibility)
#
# Git & Package Links:
#   Each L4T version entry can have:
#     status: tested|theoretically_supported|not_supported
#     git_branch: "branch-name" (displayed as GitHub link)
#     deb_package: "package-name.deb" or "" (if not available)

github_repo: "https://github.com/xenicsir/mipi_l4t_eg"
package_repo_base: "https://releases.example.com/mipi-drivers"

platforms:
  - id: nano_t210
    name: "Jetson Nano (T210)"
    description: "Jetson Nano developer kit"
    l4t_series: "32.x"
    som: "Tegra X1"
    csi_lanes: 2

  - id: xavier_nx
    name: "Xavier NX (T194)"
    description: "Jetson Xavier NX developer kit"
    l4t_series: "32.x, 35.x"
    som: "Tegra194"
    csi_lanes: 2
    variants:
      - "Jetson Xavier NX developer kit (tested)"
      - "Waveshare JETSON-IO-BASE-B (tested)"
      - "Seeed A206 carrier board (tested)"

  - id: agx_orin_devkit
    name: "AGX Orin devkit"
    description: "Jetson AGX Orin developer kit (p3701 + p3737)"
    l4t_series: "35.x, 36.x"
    som: "Tegra234"
    csi_lanes: 4
    notes: "Not tested with EG cameras - added in MIPI portage project"

  - id: agx_orin_x230d
    name: "AGX Orin Auvidea X230D"
    description: "Auvidea X230D carrier board for AGX Orin (p3701 + p3737)"
    l4t_series: "35.x, 36.x"
    som: "Tegra234"
    csi_lanes: 4
    notes: "Tested with EG cameras"

  - id: orin_nx_nano_devkit
    name: "Orin NX / Nano devkit"
    description: "Jetson Orin NX and Orin Nano developer kits (p3767 + p3768)"
    l4t_series: "35.x, 36.x"
    som: "Tegra234"
    csi_lanes: 2

  - id: forecr_ornxs
    name: "Forecr DSBOARD ORNXS"
    description: "Forecr custom board (Orin NX variant)"
    l4t_series: "35.x, 36.x"
    som: "Tegra234"
    csi_lanes: 4
    notes: "Custom build in forecr variant"

cameras:
  dione_ir:
    name: "Dione IR"
    type: "Thermal IR Camera"
    csi_lanes: 2
    i2c_addr: "0x40"

  microcube640:
    name: "MicroCube640"
    type: "VGA Thermal"
    csi_lanes: 2
    i2c_addr: "0x51"

  crius1280:
    name: "Crius1280"
    type: "LWIR"
    csi_lanes: 2
    i2c_addr: "0x52"

  smartir640:
    name: "SmartIR640"
    type: "Thermal IR"
    csi_lanes: 2
    i2c_addr: "0x53"

  ilumos:
    name: "iLumos"
    type: "Multi-Object Thermal"
    csi_lanes: 2
    i2c_addr: "0x30"
    notes: "Core + GenCP multi-object"

  microlynx:
    name: "Microlynx"
    type: "Thermal"
    csi_lanes: 2
    i2c_addr: "0x51"
    notes: "Core + GenCP multi-object"

